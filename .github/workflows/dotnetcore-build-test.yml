name: .NET Core

on:

  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

  # The release workflow runs these same tests before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:

  test:
    name: Test (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        # The test project targets net8.0 and net10.0 everywhere, plus net481
        # (.NET Framework) on Windows, the only OS that can run it.
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET 8 and .NET 10
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build

  # note: changing build/name breaks the branch protection
  # Branch protection requires a check named Build-Test. This job reports the
  # result of every matrix job under that one name. It runs even when a matrix
  # job fails, because a skipped required check would count as passing.
  build:
    name: Build-Test

    needs: test
    if: always()

    runs-on: ubuntu-latest

    steps:
    - name: Check test results
      env:
        TEST_RESULT: ${{ needs.test.result }}
      run: |
        if [ "$TEST_RESULT" != "success" ]; then
          echo "::error::Tests did not pass: $TEST_RESULT"
          exit 1
        fi
