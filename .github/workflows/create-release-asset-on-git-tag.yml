on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release on Git Tag

# Needed to create the GitHub release and attach assets.
permissions:
  contents: write

env:
  PROJECT: RecursiveDataAnnotationsValidation
  CONFIG: Release
  TARGET: netstandard2.0

jobs:
  # The same test matrix as pull requests: net8.0 and net10.0 on Linux and Windows,
  # and net481 on Windows. Nothing below runs, and no approval is requested, unless it passes.
  test:
    uses: ./.github/workflows/dotnetcore-build-test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    # Publishing needs approval from a required reviewer and only runs for v* tags.
    environment: nuget
    permissions:
      contents: write
      id-token: write # Needed for NuGet Trusted Publishing (OIDC).

    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history, needed to check that the tag is on master.

      # Only release commits that went through the protected master branch.
      - name: Verify tag is on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tagged commit is not reachable from master"
            exit 1
          fi

      # Tag names can contain shell metacharacters, so only accept vMAJOR.MINOR.PATCH[-suffix].
      - name: Get Release Version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not look like vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Print Release Version
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "RELEASE_TAG=$RELEASE_TAG"
          echo "RELEASE_VERSION=$RELEASE_VERSION"

      # The solution includes the test project, which targets net10.0, so the build needs the .NET 10 SDK.
      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet build
        run: dotnet build --configuration "$CONFIG"

      - name: dotnet publish
        working-directory: ./src/${{ env.PROJECT }}
        run: >
          dotnet publish --configuration "$CONFIG"
          /p:Version="$RELEASE_VERSION" /p:InformationalVersion="$RELEASE_VERSION"

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: dotnet pack
        run: >
          dotnet pack
          --configuration "$CONFIG"
          /p:Version="$RELEASE_VERSION"
          --include-symbols
          --output artifacts/

      - name: Inspect artifacts directory
        run: ls -l artifacts/

      - name: Archive artifacts directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT }}.artifacts.${{ env.RELEASE_VERSION }}
          path: |
            artifacts/

      # Uses the preinstalled GitHub CLI. The old actions/create-release and
      # actions/upload-release-asset actions are archived and no longer maintained.
      # The release stays a draft until the last step, because a published release is
      # immutable and cannot receive assets. A failed run leaves a draft that can be deleted.
      # Only tags with a suffix, such as v1.5.0-alpha.1, are prereleases. GitHub never marks
      # a prerelease as Latest, so stable tags must not be prereleases.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Release $RELEASE_TAG" \
            "${args[@]}"

      - name: Create release directory
        run: mkdir -p release

      # Plain zip instead of a third-party action, so nothing else can touch
      # artifacts/ between "dotnet pack" and "dotnet nuget push".
      - name: Create Release Zip File
        run: zip -r "release/${PROJECT}-${RELEASE_TAG}.zip" LICENSE README.md artifacts/

      - name: Inspect release directory
        run: ls -l release/

      - name: Archive release directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROJECT }}.release.${{ env.RELEASE_TAG }}
          path: |
            release/

      # NOTE: RELEASE_CREATE is never set, so this step is skipped (same as before).
      - name: Attach Zip to GitHub Release
        if: ${{ env.RELEASE_CREATE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "$RELEASE_TAG"
          "release/${PROJECT}-${RELEASE_TAG}.zip"

      - name: Attach .nupkg and .snupkg files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "$RELEASE_TAG"
          "artifacts/${PROJECT}.${RELEASE_VERSION}.nupkg"
          "artifacts/${PROJECT}.${RELEASE_VERSION}.snupkg"

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish on nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          -k "$NUGET_API_KEY"
          -s https://api.nuget.org/v3/index.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false
